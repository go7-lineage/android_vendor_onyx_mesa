[constants]
target = ['--target=@target@', '--sysroot=@sysroot@', '-resource-dir=@resource@']
static_cxx = ['--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
no_unwinding = ['-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']

[binaries]
c = ['clang'] + target
cpp = ['clang++'] + target + no_unwinding + static_cxx
ar = 'llvm-ar'
strip = 'llvm-strip'
c_ld = 'lld'
cpp_ld = 'lld'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = '@empty@'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'
